<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9B7FD4">
<title>もふスタ100日 制作ボード</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#9B7FD4;--purple-dark:#6B5B95;--purple-light:#D4C4F0;--purple-bg:#F3EEFF;
  --pink:#FFB8D0;--mint:#B8E8D0;--yellow:#FFE4A0;
  --ink:#2D2640;--ink-soft:#5C5470;--ink-light:#9B94AD;--white:#fff;
  --radius:22px;--nav-h:72px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:'M PLUS Rounded 1c',-apple-system,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--purple-bg);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 90% 5%,rgba(255,184,208,.35) 0%,transparent 40%),
    radial-gradient(circle at 5% 95%,rgba(184,232,208,.3) 0%,transparent 38%),
    radial-gradient(circle at 50% 50%,rgba(155,127,212,.08) 0%,transparent 60%);
}

.screen{display:none;flex:1;flex-direction:column;overflow:hidden;padding-top:var(--safe-top);position:relative;z-index:1}
.screen.active{display:flex}
.scroll-body{flex:1;overflow-y:auto;padding:0 16px calc(var(--nav-h) + var(--safe-bottom) + 16px);-webkit-overflow-scrolling:touch}

/* header */
.app-header{padding:16px 20px 8px;flex-shrink:0}
.app-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--white);border:2px solid var(--purple-light);
  padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;
  color:var(--purple-dark);margin-bottom:8px;
}
.app-title{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1.3}
.app-sub{font-size:12px;color:var(--ink-light);margin-top:4px;font-weight:500}

/* cards */
.card{
  background:var(--white);border-radius:var(--radius);padding:18px;
  margin-bottom:14px;border:2.5px solid var(--purple-light);
  box-shadow:0 4px 0 rgba(155,127,212,.15);
}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-icon{font-size:22px;line-height:1}
.card-title{font-size:15px;font-weight:800;letter-spacing:.04em}

/* progress ring */
.progress-hero{text-align:center;padding:8px 0 4px}
.ring-wrap{position:relative;width:140px;height:140px;margin:0 auto 12px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-num{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring-pct{font-size:36px;font-weight:800;color:var(--purple);line-height:1}
.ring-label{font-size:11px;color:var(--ink-light);font-weight:700;margin-top:2px}
.cheer{
  background:linear-gradient(135deg,var(--purple-bg),#fff);
  border:2px dashed var(--purple-light);border-radius:16px;
  padding:12px 16px;font-size:13px;line-height:1.7;font-weight:500;color:var(--ink-soft);
}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat-box{
  background:var(--purple-bg);border-radius:14px;padding:10px 6px;text-align:center;
  border:1.5px solid var(--purple-light);
}
.stat-num{font-size:20px;font-weight:800;color:var(--purple)}
.stat-lbl{font-size:10px;color:var(--ink-light);font-weight:700;margin-top:2px}

/* next up */
.next-card{
  background:linear-gradient(135deg,var(--purple) 0%,#B89AE8 100%);
  color:var(--white);border:none;box-shadow:0 4px 0 #6B5B95;
  cursor:pointer;transition:transform .15s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.next-card:active{transform:scale(.98)}
.next-card .card-title{color:var(--white)}
.next-day-num{font-size:11px;opacity:.85;font-weight:700;margin-bottom:4px}
.next-title{font-size:16px;font-weight:800;line-height:1.45;margin-bottom:8px}
.next-steps{display:flex;gap:6px;flex-wrap:wrap}
.next-chip{
  background:rgba(255,255,255,.2);border-radius:999px;
  padding:3px 10px;font-size:10px;font-weight:700;
}

/* phase cards */
.phase-grid{display:flex;flex-direction:column;gap:10px}
.phase-card{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--white);border-radius:18px;border:2px solid var(--purple-light);
  cursor:pointer;transition:transform .15s;
}
.phase-card:active{transform:scale(.98)}
.phase-emoji{font-size:28px;flex-shrink:0}
.phase-info{flex:1;min-width:0}
.phase-name{font-size:13px;font-weight:800;margin-bottom:4px}
.phase-range{font-size:11px;color:var(--ink-light);font-weight:500}
.phase-bar{height:6px;background:var(--purple-bg);border-radius:99px;margin-top:6px;overflow:hidden}
.phase-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s}
.phase-count{font-size:12px;font-weight:800;color:var(--purple);flex-shrink:0}

/* filters */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch;flex-shrink:0}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;padding:7px 14px;border-radius:999px;border:2px solid var(--purple-light);
  background:var(--white);font-family:inherit;font-size:12px;font-weight:700;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;
}
.filter-btn.active{background:var(--purple);border-color:var(--purple);color:var(--white)}

.search-box{
  margin:0 16px 12px;padding:10px 14px;border-radius:14px;
  border:2px solid var(--purple-light);background:var(--white);
  font-family:inherit;font-size:14px;outline:none;width:calc(100% - 32px);
}

/* day list */
.day-item{
  display:flex;align-items:flex-start;gap:10px;padding:14px;
  background:var(--white);border-radius:18px;margin-bottom:10px;
  border:2px solid var(--purple-light);cursor:pointer;transition:transform .15s;
}
.day-item:active{transform:scale(.99)}
.day-item.done{border-color:var(--mint);background:linear-gradient(135deg,#fff,#f0fff8)}
.day-num{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:var(--purple-bg);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--purple);
}
.day-item.done .day-num{background:var(--mint);color:#2D6B4F}
.day-body{flex:1;min-width:0}
.day-title{font-size:13px;font-weight:700;line-height:1.45;margin-bottom:6px}
.day-meta{display:flex;gap:4px;flex-wrap:wrap}
.step-dot{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--purple-light);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;
  color:var(--ink-light);background:var(--white);
}
.step-dot.on{background:var(--purple);border-color:var(--purple);color:var(--white)}

/* detail */
.detail-header{padding:16px 20px 0;flex-shrink:0}
.back-btn{
  display:inline-flex;align-items:center;gap:4px;
  border:none;background:none;font-family:inherit;font-size:14px;
  font-weight:700;color:var(--purple);cursor:pointer;padding:4px 0;margin-bottom:8px;
}
.detail-day-badge{
  display:inline-block;background:var(--purple);color:var(--white);
  padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:8px;
}
.detail-title{font-size:18px;font-weight:800;line-height:1.4;margin-bottom:12px}
.detail-desc{
  font-size:13px;color:var(--ink-soft);line-height:1.75;
  background:var(--purple-bg);border-radius:14px;padding:14px;margin-bottom:16px;
}
.step-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.step-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--white);border-radius:16px;border:2.5px solid var(--purple-light);
  cursor:pointer;transition:all .15s;
}
.step-row.done{border-color:var(--purple);background:var(--purple-bg)}
.step-check{
  width:28px;height:28px;border-radius:10px;border:2.5px solid var(--purple-light);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:14px;transition:all .15s;
}
.step-row.done .step-check{background:var(--purple);border-color:var(--purple);color:var(--white)}
.step-label{font-size:14px;font-weight:700;flex:1}
.step-row.done .step-label{color:var(--purple-dark)}
.detail-memo{
  width:100%;border:2px solid var(--purple-light);border-radius:14px;
  padding:12px;font-family:inherit;font-size:13px;line-height:1.6;
  resize:none;min-height:80px;outline:none;background:var(--white);
}
.detail-memo:focus{border-color:var(--purple)}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);background:var(--white);
  border-top:2px solid var(--purple-light);display:flex;z-index:10;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;font-family:inherit;cursor:pointer;
  color:var(--ink-light);font-size:10px;font-weight:700;padding-top:6px;
}
.nav-item.active{color:var(--purple)}
.nav-icon{font-size:22px;line-height:1}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti-piece{
  position:absolute;width:10px;height:10px;border-radius:3px;
  animation:fall 1.2s ease-out forwards;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

.empty-msg{text-align:center;padding:40px 20px;color:var(--ink-light);font-size:13px;line-height:1.8}
.section-label{font-size:12px;font-weight:800;color:var(--purple);letter-spacing:.08em;margin:16px 0 10px;padding-left:4px}
</style>
</head>
<body>

<div id="confetti" class="confetti" hidden></div>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="app-header">
    <div class="app-badge">✦ 制作管理ツール</div>
    <div class="app-title">もふスタ100日<br>制作ボード</div>
    <div class="app-sub">動画コンテンツ制作の進捗を可愛く管理 🎬</div>
  </div>
  <div class="scroll-body">
    <div class="card">
      <div class="progress-hero">
        <div class="ring-wrap">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="60" fill="none" stroke="#E8DFF8" stroke-width="10"/>
            <circle id="ring-arc" cx="70" cy="70" r="60" fill="none" stroke="#9B7FD4" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"/>
          </svg>
          <div class="ring-num">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-label">公開済み</div>
          </div>
        </div>
        <div class="cheer" id="cheer-msg">まずは Day1 から！一歩ずついこう ✨</div>
        <div class="stats-row">
          <div class="stat-box"><div class="stat-num" id="stat-done">0</div><div class="stat-lbl">公開済み</div></div>
          <div class="stat-box"><div class="stat-num" id="stat-wip">0</div><div class="stat-lbl">制作中</div></div>
          <div class="stat-box"><div class="stat-num" id="stat-left">100</div><div class="stat-lbl">残り</div></div>
        </div>
      </div>
    </div>

    <div class="card next-card" id="next-card" role="button" tabindex="0" aria-label="次に作るDayを開く">
      <div class="next-day-num" id="next-day-num">NEXT UP</div>
      <div class="next-title" id="next-title">Day1 を作ろう！</div>
      <div class="next-steps" id="next-steps"></div>
    </div>

    <div class="section-label">PHASE 進捗</div>
    <div class="phase-grid" id="phase-grid"></div>
  </div>
</div>

<!-- LIST -->
<div id="screen-list" class="screen">
  <div class="app-header">
    <div class="app-title">コンテンツ一覧</div>
    <div class="app-sub">100日分の動画リスト</div>
  </div>
  <input type="search" class="search-box" id="search-input" placeholder="🔍 タイトルで検索…">
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="todo">未着手</button>
    <button class="filter-btn" data-filter="wip">制作中</button>
    <button class="filter-btn" data-filter="done">公開済</button>
  </div>
  <div class="scroll-body" id="day-list" style="padding-top:0"></div>
</div>

<!-- FOCUS -->
<div id="screen-focus" class="screen">
  <div class="app-header">
    <div class="app-title">制作中リスト</div>
    <div class="app-sub">途中まで進んでるやつ</div>
  </div>
  <div class="scroll-body" id="focus-list"></div>
</div>

<!-- DETAIL -->
<div id="screen-detail" class="screen">
  <div class="detail-header">
    <button class="back-btn" id="back-btn">← 戻る</button>
    <div class="detail-day-badge" id="detail-badge">Day 1</div>
    <div class="detail-title" id="detail-title"></div>
  </div>
  <div class="scroll-body" style="padding-top:0">
    <div class="detail-desc" id="detail-desc"></div>
    <div class="section-label">制作ステップ</div>
    <div class="step-list" id="step-list"></div>
    <div class="section-label">メモ</div>
    <textarea class="detail-memo" id="detail-memo" placeholder="台本のメモ、収録日、気づきなど…"></textarea>
  </div>
</div>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-screen="home"><span class="nav-icon">🏠</span>ホーム</button>
  <button class="nav-item" data-screen="list"><span class="nav-icon">📋</span>一覧</button>
  <button class="nav-item" data-screen="focus"><span class="nav-icon">🎬</span>制作中</button>
</nav>

<script>
const STEPS=['script','record','edit','publish'];
const STEP_LABELS={script:'📝 台本',record:'🎥 収録',edit:'✂️ 編集',publish:'🚀 MOSH公開'};
const STORAGE_KEY='mofu100days-v1';

const PHASES=[
  {id:0,name:'はじめの一歩',emoji:'🌱',range:[1,7],color:'#B8E8D0'},
  {id:1,name:'プロンプト基礎',emoji:'✏️',range:[8,25],color:'#FFB8D0'},
  {id:2,name:'Midjourney',emoji:'🎨',range:[26,50],color:'#9B7FD4'},
  {id:3,name:'発信デビュー',emoji:'📱',range:[51,75],color:'#FFE4A0'},
  {id:4,name:'フォロワー100人',emoji:'🌟',range:[76,100],color:'#FF9EB5'}
];

const DAYS=[
{d:1,t:'100日チャレンジの全体像と、ChatGPTの準備',b:'ゴール説明。ChatGPTアカウント作成・有料プラン確認。Discord・MOSHの使い方。'},
{d:2,t:'プロンプト1行で、最初の1枚を作る',b:'「かわいい女の子のイラスト」で生成。生成→保存までの基本操作。'},
{d:3,t:'言葉を変えると絵が変わる！修正の基本',b:'前日の画像を日本語で修正。AIへの指示＝会話の感覚を体得。'},
{d:4,t:'5要素プロンプトで狙い通りに近づける',b:'誰・何を・雰囲気・構図・画風の5つを意識。プロンプトの型をテンプレ化。'},
{d:5,t:'3テーマで「自分の好き」を探す',b:'かわいい系／大人っぽい系／ファンタジー系を1枚ずつ。好みメモの書き方。'},
{d:6,t:'Before/Afterでクオリティを上げる',b:'気に入った1枚を3回修正。何を変えたらどう変わったか記録。'},
{d:7,t:'Week1振り返り｜ベスト3と好きな理由',b:'今週のベスト3選定。なぜ好きか3行で書く。来週の目標設定。'},
{d:8,t:'髪型・目・服装を1つずつ指定する',b:'パーツ別プロンプト。髪型→目→服装の順で指定。'},
{d:9,t:'表情4種類を作り分ける',b:'笑顔・困り顔・照れ顔・真剣顔を4枚。表情ワード集。'},
{d:10,t:'ポーズ4種類を作り分ける',b:'立ち・座り・手を振る・横向き。ポーズ指定のコツ。'},
{d:11,t:'構図4種類を作り分ける',b:'全身・バストアップ・アップ・斜め構図。構図ワード集。'},
{d:12,t:'背景4種類を作り分ける',b:'白背景・室内・屋外・シンプルな柄。背景で雰囲気が変わる体験。'},
{d:13,t:'画風4種類を試す',b:'アニメ調・水彩・フラット・ゆるい線画。自分に合う画風の発見。'},
{d:14,t:'Week2振り返り｜プロンプト全文で再現する',b:'ベスト1枚をプロンプト全文で再現。パーツ別練習のまとめ。'},
{d:15,t:'好きなパーツを1枚に統合する①',b:'髪型＋表情＋ポーズを組み合わせ。統合プロンプトの書き方。'},
{d:16,t:'好きなパーツを1枚に統合する②',b:'画風＋背景＋構図を組み合わせ。統合の順番のコツ。'},
{d:17,t:'小物を添えて世界観を広げる',b:'花・本・カップ・動物を1つずつ持たせる。小物指定の例文。'},
{d:18,t:'配色で同じキャラの印象を変える',b:'パステル・モノトーン・ビビッドで3枚。配色ワード集。'},
{d:19,t:'同じキャラで春夏秋冬4枚シリーズ',b:'季節要素の入れ方。シリーズ感の出し方。'},
{d:20,t:'統一感のある3枚を作る',b:'同じ世界観・色味で3枚。統一感チェックリスト。'},
{d:21,t:'Week3振り返り｜自分の定番プロンプトを作る',b:'定番プロンプト1つ完成。今後のベースとして保存。'},
{d:22,t:'ChatGPTの限界を知る｜MJ移行前の準備',b:'手・統一感・細かい指定の難しさ。限界メモとMidjourney移行の理由。'},
{d:23,t:'Midjourneyの準備・登録・アカウント設定',b:'MJアカウント作成・Discord参加。基本画面の見方。'},
{d:24,t:'ChatGPTプロンプトを英語に翻訳する',b:'使っていたプロンプトを英語化。翻訳のコツと基本単語。'},
{d:25,t:'ChatGPT vs Midjourney｜同じプロンプトで比較',b:'同じ内容を両方で生成。違いを3つ書く。Phase1総まとめ。'},
{d:26,t:'Midjourneyで最初の1枚を作る',b:'/imagine の使い方。初回生成〜保存まで。'},
{d:27,t:'UpscaleとVariationでベストを選ぶ',b:'U1〜U4、V1〜V4の使い分け。良い絵の選び方。'},
{d:28,t:'MJプロンプトの基本構造を理解する',b:'主語＋詳細＋画風＋品質ワード。基本テンプレ。'},
{d:29,t:'アスペクト比（--ar）でサイズを変える',b:'1:1／16:9／9:16で同じプロンプト。用途別サイズ。'},
{d:30,t:'stylize（--stylize）で画風の強さを調整',b:'低・中・高で比較。自分好みの数値を見つける。'},
{d:31,t:'chaos（--chaos）でバリエーションを増やす',b:'0／50／100で比較。意外性と安定性のバランス。'},
{d:32,t:'ネガティブプロンプト（--no）で不要要素を消す',b:'余計な要素の除外。よく使う --no 例。'},

const CHEERS=[
[0,'まずは Day1 から！一歩ずついこう ✨'],
[1,'スタート切った！この調子 🌱'],
[10,'10本突破！最初の10本がいちばん大変 💪'],
[25,'4分の1完了！ここまで来た自分すごい 🎉'],
[50,'半分達成！！折り返し地点 🏔️'],
[75,'あと25本！ラストスパート前 🚀'],
[90,'あと10本！ゴールが見えてきた 🌟'],
[100,'100本全部完成！！天才すぎ 🎊']
];

let progress=loadProgress();
let currentDay=null;
let listFilter='all';
let prevScreen='home';

function loadProgress(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}
  catch{return{}}
}
function saveProgress(){localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}
function getDay(d){return progress[d]||{steps:{},memo:''}}
function isDone(d){return!!getDay(d).steps.publish}
function stepCount(d){return STEPS.filter(s=>getDay(d).steps[s]).length}
function isWip(d){const c=stepCount(d);return c>0&&!isDone(d)}
function getPhase(d){return PHASES.find(p=>d>=p.range[0]&&d<=p.range[1])}

function getCheer(n){
  let msg=CHEERS[0][1];
  for(const [threshold,text] of CHEERS){if(n>=threshold)msg=text}
  return msg;
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active',n.dataset.screen===name);
  });
  if(name!=='detail')prevScreen=name;
}

function renderHome(){
  const done=DAYS.filter(d=>isDone(d.d)).length;
  const wip=DAYS.filter(d=>isWip(d.d)).length;
  const pct=Math.round(done/100*100);
  document.getElementById('ring-pct').textContent=pct+'%';
  document.getElementById('ring-arc').style.strokeDashoffset=377-(377*pct/100);
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-wip').textContent=wip;
  document.getElementById('stat-left').textContent=100-done;
  document.getElementById('cheer-msg').textContent=getCheer(done);

  const next=DAYS.find(d=>!isDone(d.d));
  if(next){
    document.getElementById('next-day-num').textContent='NEXT UP — Day '+next.d;
    document.getElementById('next-title').textContent=next.t;
    const steps=getDay(next.d).steps;
    document.getElementById('next-steps').innerHTML=STEPS.map(s=>
      `<span class="next-chip">${steps[s]?'✓':'○'} ${STEP_LABELS[s].slice(2)}</span>`
    ).join('');
    document.getElementById('next-card').onclick=()=>openDetail(next.d);
  }else{
    document.getElementById('next-day-num').textContent='ALL DONE!';
    document.getElementById('next-title').textContent='100本全部完成おめでとう 🎊';
    document.getElementById('next-steps').innerHTML='';
    document.getElementById('next-card').onclick=null;
  }

  document.getElementById('phase-grid').innerHTML=PHASES.map(p=>{
    const days=DAYS.filter(d=>d.d>=p.range[0]&&d.d<=p.range[1]);
    const pDone=days.filter(d=>isDone(d.d)).length;
    const pct2=Math.round(pDone/days.length*100);
    return`<div class="phase-card" data-phase="${p.id}">
      <div class="phase-emoji">${p.emoji}</div>
      <div class="phase-info">
        <div class="phase-name">${p.name}</div>
        <div class="phase-range">Day ${p.range[0]}–${p.range[1]}</div>
        <div class="phase-bar"><div class="phase-fill" style="width:${pct2}%;background:${p.color}"></div></div>
      </div>
      <div class="phase-count">${pDone}/${days.length}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.phase-card').forEach(el=>{
    el.onclick=()=>{
      listFilter='all';
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
      showScreen('list');
      renderList(parseInt(el.dataset.phase));
    };
  });
}

function renderDayItem(day){
  const st=getDay(day.d);
  const done=isDone(day.d);
  return`<div class="day-item${done?' done':''}" data-day="${day.d}">
    <div class="day-num">${day.d}</div>
    <div class="day-body">
      <div class="day-title">${day.t}</div>
      <div class="day-meta">${STEPS.map(s=>
        `<span class="step-dot${st.steps[s]?' on':''}">${st.steps[s]?'✓':STEP_LABELS[s].slice(0,1)}</span>`
      ).join('')}</div>
    </div>
  </div>`;
}

function renderList(phaseFilter){
  const q=document.getElementById('search-input').value.toLowerCase();
  let items=DAYS.filter(day=>{
    if(phaseFilter!==undefined){
      const p=PHASES[phaseFilter];
      if(day.d<p.range[0]||day.d>p.range[1])return false;
    }
    if(q&&!day.t.toLowerCase().includes(q)&&!('day'+day.d).includes(q))return false;
    if(listFilter==='todo')return stepCount(day.d)===0;
    if(listFilter==='wip')return isWip(day.d);
    if(listFilter==='done')return isDone(day.d);
    return true;
  });
  const el=document.getElementById('day-list');
  el.innerHTML=items.length?items.map(renderDayItem).join(''):
    '<div class="empty-msg">該当なし 🫧</div>';
  el.querySelectorAll('.day-item').forEach(item=>{
    item.onclick=()=>openDetail(parseInt(item.dataset.day));
  });
}

function renderFocus(){
  const items=DAYS.filter(d=>isWip(d.d));
  const el=document.getElementById('focus-list');
  el.innerHTML=items.length?items.map(renderDayItem).join(''):
    '<div class="empty-msg">制作中のコンテンツはまだないよ 🎬<br>一覧から Day を選んで始めよう！</div>';
  el.querySelectorAll('.day-item').forEach(item=>{
    item.onclick=()=>openDetail(parseInt(item.dataset.day));
  });
}

function openDetail(d){
  currentDay=d;
  const day=DAYS.find(x=>x.d===d);
  const st=getDay(d);
  document.getElementById('detail-badge').textContent='Day '+d;
  document.getElementById('detail-title').textContent=day.t;
  document.getElementById('detail-desc').textContent=day.b;
  document.getElementById('detail-memo').value=st.memo||'';
  document.getElementById('step-list').innerHTML=STEPS.map(s=>`
    <div class="step-row${st.steps[s]?' done':''}" data-step="${s}">
      <div class="step-check">${st.steps[s]?'✓':''}</div>
      <div class="step-label">${STEP_LABELS[s]}</div>
    </div>`).join('');
  document.getElementById('step-list').querySelectorAll('.step-row').forEach(row=>{
    row.onclick=()=>toggleStep(d,row.dataset.step);
  });
  showScreen('detail');
}

function toggleStep(d,step){
  const st=getDay(d);
  const wasOff=!st.steps[step];
  st.steps[step]=!st.steps[step];
  if(!st.steps[step])delete st.steps[step];
  progress[d]=st;
  saveProgress();
  if(step==='publish'&&wasOff)fireConfetti();
  openDetail(d);
  renderHome();
  renderList();
  renderFocus();
}

function fireConfetti(){
  const el=document.getElementById('confetti');
  el.hidden=false;el.innerHTML='';
  const colors=['#9B7FD4','#FFB8D0','#B8E8D0','#FFE4A0','#FF9EB5'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=Math.random()*.5+'s';
    p.style.animationDuration=(.8+Math.random()*.8)+'s';
    el.appendChild(p);
  }
  setTimeout(()=>{el.hidden=true;el.innerHTML=''},2000);
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.onclick=()=>{
    showScreen(btn.dataset.screen);
    if(btn.dataset.screen==='home')renderHome();
    if(btn.dataset.screen==='list')renderList();
    if(btn.dataset.screen==='focus')renderFocus();
  };
});

document.getElementById('back-btn').onclick=()=>{
  showScreen(prevScreen);
  renderHome();renderList();renderFocus();
};

document.getElementById('search-input').oninput=()=>renderList();
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    listFilter=btn.dataset.filter;
    renderList();
  };
});

document.getElementById('detail-memo').oninput=function(){
  if(!currentDay)return;
  const st=getDay(currentDay);
  st.memo=this.value;
  progress[currentDay]=st;
  saveProgress();
};

renderHome();
renderList();
renderFocus();
</script>
